<div class="armazon">
  <header class="encabezado">
    <div class="solventa-contenedor barra">
      <button class="hamburguesa" type="button" aria-label="Abrir menú"
        aria-controls="menu-cuenta" [attr.aria-expanded]="menuAbierto()"
        (click)="menuAbierto.set(!menuAbierto())">
        <span></span><span></span><span></span>
      </button>
      <a class="solventa-logo marca" [routerLink]="rutas.cuenta" (click)="cerrarMenu()">Solventa</a>
      <div class="derecha"><span>ES · CO</span><span>Accesibilidad</span></div>
    </div>
    @if (menuAbierto()) {
      <nav id="menu-cuenta" class="menu-desplegable" aria-label="Menú de cuenta">
        <button type="button" (click)="salir()">Cerrar sesión</button>
      </nav>
    }
  </header>
  <main id="contenido"><router-outlet /></main>
  <footer class="pie solventa-contenedor">
    <span>© 2026 Solventa</span><span>Términos · Privacidad</span>
  </footer>
</div>
