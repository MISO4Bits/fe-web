<section class="login-page" aria-labelledby="login-title">
  <h1 id="login-title">Entra a tu cuenta</h1>
  <p class="intro">Tus cotizaciones y tus seguros, en un solo lugar.</p>
  <div class="login-card">
    <div class="field">
      <label for="login-email">Correo electrónico</label>
      <input id="login-email" type="email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" autocomplete="current-password" />
    </div>
    <button class="primary enter" type="button" disabled>Ingresar</button>
    <button class="forgot" type="button" disabled>¿Olvidaste tu contraseña?</button>
  </div>
  <p class="new-account">¿Todavía no tienes cuenta?</p>
  <a class="create-account" routerLink="/crear-cuenta">Crear cuenta nueva</a>
</section>
